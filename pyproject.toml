[project]
name = "huesight"
version = "0.1.0"
description = "Code and data for the bachelor's thesis \"How Do LLMs Perceive Color in Graph Drawings?\""
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "colour-science>=0.4.7",
    "google-genai>=2.25.0",
    "matplotlib==3.11.2",
    "networkx==3.7",
    "numpy==2.5.3",
    "openai>=3.22.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.uv]
package = false
